name: cobrasong
description: COBRASONG - música, comunidade e jogos em um só lugar.
publish_to: "none"
version: 0.9.10+19

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  just_audio: ^0.9.46
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.18
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/cobrasong.png
  adaptive_icon_background: "#080510"
  adaptive_icon_foreground: assets/icon/cobrasong.png
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true
